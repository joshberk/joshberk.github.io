<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://www.google-analytics.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="same-origin">
    <meta http-equiv="Permissions-Policy" content="accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()">
    <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJjdXJyZW50Q29sb3IiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj4KICA8cGF0aCBkPSJNNCAxN0wxMCAxMUw0IDUiLz4KICA8cGF0aCBkPSJNMTIgMTlIMjAiLz4KPC9zdmc+">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">

    <!-- Custom meta tags -->
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="keywords" content="Joshua Berkoh, cryptography, cybersecurity, PhD, portfolio, research">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:image" content="{{ site.url }}/assets/images/hero.png">

    {% seo %}

    <!-- MathJax Configuration (external file for CSP compliance) -->
    <script src="{{ '/assets/js/mathjax-config.js' | relative_url }}"></script>
    <!-- MathJax: Using @3 (latest v3.x) from jsdelivr CDN. SRI not used because:
         1. @3 tag resolves to latest version, which changes SRI hash on updates
         2. jsdelivr is a trusted CDN with its own integrity verification
         To pin with SRI: use specific version like mathjax@3.2.2 and generate hash -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" crossorigin="anonymous"></script>

    <!-- Google Analytics (no SRI - GA uses dynamic content that doesn't support integrity checks) -->
    {% if site.google_analytics %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script src="{{ '/assets/js/analytics.js' | relative_url }}" data-ga-id="{{ site.google_analytics }}"></script>
    {% endif %}
  </head>

  <body>
    <header>
      <div class="container">
        <nav class="header-nav">
          <a id="a-title" href="{{ '/' | relative_url }}" class="site-brand">
            <span class="brand-name">{{ site.title | default: site.github.repository_name }}</span>
          </a>
          <div class="nav-links">
            <a href="{{ '/' | relative_url }}" class="nav-link">Home</a>
            <a href="{{ '/blog/' | relative_url }}" class="nav-link">Blog</a>
            <a href="{{ '/assets/resume.pdf' | relative_url }}" class="nav-link" target="_blank" rel="noopener noreferrer">CV</a>
            <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="false">☀️</button>
          </div>
        </nav>
      </div>
    </header>

    <div class="container">
      <section id="main_content">
        {{ content }}
      </section>
    </div>

    <!-- Custom JavaScript -->
    <script src="{{ "/assets/js/main.js" | relative_url }}"></script>

    <!-- Footer with current year -->
    <footer>
      <div class="container">
        <p>&copy; <span id="year"></span> {{ site.author.name | default: site.title }}. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
