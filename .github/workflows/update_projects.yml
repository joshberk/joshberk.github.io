name: Update Projects Data

# Fetch selected public repositories and write _data/projects.yml
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Fetch GitHub repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "yaml"
          require "json"
          require "uri"
          require "net/http"

          token = ENV.fetch("GITHUB_TOKEN")
          config = YAML.load_file("_data/featured_projects.yml") || {}
          owner = (config["owner"] || "").strip
          repos = config["repos"] || config["featured"] || []

          repo_slugs = repos.map do |repo|
            value = repo.to_s.strip
            next nil if value.empty?
            value.include?("/") ? value : [owner, value].reject(&:empty?).join("/")
          end.compact

          if repo_slugs.empty?
            abort("No repositories configured in _data/featured_projects.yml")
          end

          projects = []
          repo_slugs.each do |slug|
            uri = URI("https://api.github.com/repos/#{slug}")
            req = Net::HTTP::Get.new(uri)
            req["Authorization"] = "Bearer #{token}"
            req["Accept"] = "application/vnd.github+json"
            req["User-Agent"] = "github-actions/update-projects"

            res = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(req) }
            unless res.is_a?(Net::HTTPSuccess)
              abort("Failed to fetch #{slug}: HTTP #{res.code} #{res.message}")
            end

            data = JSON.parse(res.body)
            projects << {
              "name" => data["name"],
              "full_name" => data["full_name"],
              "description" => (data["description"] || "").gsub(/[\r\n]+/, " ").strip,
              "url" => data["html_url"],
              "language" => data["language"] || "",
              "stars" => data["stargazers_count"] || 0,
              "forks" => data["forks_count"] || 0,
              "updated" => data["pushed_at"] || data["updated_at"]
            }
          end

          File.write("_data/projects.yml", { "projects" => projects }.to_yaml)
          puts "Wrote #{projects.length} repositories to _data/projects.yml"
          RUBY

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/projects.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update _data/projects.yml (auto)"
          git push
