<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog | Joshua Offe Berkoh</title>
    <link rel="stylesheet" href="css/demo_blog.css" />
  </head>
  <body>
    <header>
      <h1>Blog</h1>
    </header>
    <nav class="category-nav" aria-label="Filter posts">
      <button class="category-pill" data-category="All" aria-pressed="true">All</button>
      <button class="category-pill" data-category="Cryptography" aria-pressed="false">Cryptography</button>
      <button class="category-pill" data-category="OSINT" aria-pressed="false">OSINT</button>
      <button class="category-pill" data-category="Reverse Engineering" aria-pressed="false">Reverse Engineering</button>
      <button class="category-pill" data-category="Malware" aria-pressed="false">Malware</button>
    </nav>
    <main id="posts"></main>
    <script>
      const posts = [
        {
          title: "Pivoting to Cryptography With Purpose: Embracing The Rigor",
          date: "July 2025",
          summary: "Reflections on transitioning from general cybersecurity to the rigorous world of cryptography, emphasising the importance of formal definitions, security models and a strong mathematical foundation.",
          category: "Cryptography",
          url: "blog/pivoting-cryptography.html"
        },
        {
          title: "Week 1: Foundational Encryption Concepts",
          date: "August 2025",
          summary: "An accessible introduction to core encryption principles, comparing symmetric and asymmetric techniques and explaining how keys, plaintext and ciphertext work together in secure communication.",
          category: "Cryptography",
          url: "blog/week-1-foundational-encryption-concepts.html"
        },
        {
          title: "OSINT Techniques for Modern Investigations",
          date: "March 2024",
          summary: "Practical open source intelligence workflows for uncovering digital footprints and tracing malicious actors.",
          category: "OSINT",
          url: "blog/osint-techniques-for-modern-investigations.html"
        },
        {
          title: "Reverse Engineering a Botnet Sample",
          date: "November 2023",
          summary: "A walkthrough of dissecting a simple malware specimen to reveal its command-and-control logic.",
          category: "Reverse Engineering",
          url: "blog/reverse-engineering-a-botnet-sample.html"
        },
        {
          title: "Building a Secure Home Lab on a Budget",
          date: "May 2022",
          summary: "Tips for assembling a cost-effective lab environment for cybersecurity experiments.",
          category: "Malware",
          url: "blog/building-a-secure-home-lab-on-a-budget.html"
        }
      ];

      function createCard(post) {
        const article = document.createElement("article");
        article.className = "post-card";

        const title = document.createElement("h2");
        const link = document.createElement("a");
        link.href = post.url;
        link.textContent = post.title;
        title.appendChild(link);

        const date = document.createElement("p");
        date.className = "post-date";
        date.textContent = post.date;

        const summary = document.createElement("p");
        summary.textContent = post.summary;

        article.appendChild(title);
        article.appendChild(date);
        article.appendChild(summary);

        return article;
      }

      function renderPosts(category = "All") {
        const container = document.getElementById("posts");
        container.innerHTML = "";
        const filtered =
          category === "All"
            ? posts
            : posts.filter((p) => p.category === category);

        if (filtered.length === 0) {
          const msg = document.createElement("p");
          msg.textContent = "No posts available.";
          container.appendChild(msg);
          return;
        }

        filtered.forEach((post) => container.appendChild(createCard(post)));
      }

      document
        .querySelector(".category-nav")
        .addEventListener("click", (e) => {
          const pill = e.target.closest(".category-pill");
          if (!pill) return;
          document
            .querySelectorAll(".category-pill")
            .forEach((b) => b.setAttribute("aria-pressed", b === pill));
          renderPosts(pill.dataset.category);
        });

      renderPosts();
    </script>
  </body>
</html>
