title: "Joshua Berkoh"
description: "PhD student in information technology with a passion for applied cryptography and cybersecurity"
url: "https://www.joshuaberkoh.engineer"
baseurl: ""

# Theme
remote_theme: pages-themes/hacker@v0.2.0

# GitHub Pages compatible plugins
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Author information
author:
  name: "Joshua Offe Berkoh"

# GitHub settings for theme
github:
  repository_name: "joshberk.github.io"
  repository_url: "https://github.com/joshberk/joshberk.github.io"

# Blog settings
show_excerpts: true

# Collections for blog posts (simplified)
collections:
  posts:
    output: true

# Default values for posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Joshua Berkoh"

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax

# Exclude files from processing (GitHub Pages compatible)
exclude:
  - scripts/
  - test/
  - data/
  - includes/
  - node_modules/
  - package.json
  - README.md
  - Gemfile
  - Gemfile.lock
  - "*.config.js"