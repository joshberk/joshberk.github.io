title: "Joshua Berkoh"
description: "PhD student in information technology with a passion for applied cryptography and cybersecurity"
url: "https://www.joshuaberkoh.engineer"
baseurl: ""

# Theme
remote_theme: pages-themes/hacker@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap

# Author information
author:
  name: "Joshua Offe Berkoh"
  email: "your-email@example.com"

# Social links (customize as needed)
github_username: joshberk
linkedin_username: joshua-berkoh

# Blog settings
show_excerpts: true
paginate: 5

# Collections for blog posts
collections:
  posts:
    output: true
    permalink: /blog/:categories/:title/

# Default values for posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Joshua Berkoh"

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Exclude files from processing
exclude:
  - scripts/
  - test/
  - data/
  - includes/
  - node_modules/
  - package.json
  - README.md
  - Gemfile
  - Gemfile.lock