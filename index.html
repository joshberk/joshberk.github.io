<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Blog</title>
    <link rel="stylesheet" href="css/demo_blog.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>Demo Blog</h1>
      <p>A lightweight demo homepage.</p>
    </header>

    <main>
      <section class="latest" aria-label="Latest Posts">
        <h2>Latest Posts</h2>
        <div id="latest-posts" class="posts"></div>
      </section>
    </main>

    <script>
      const posts = [
        {
          title: "Pivoting to Cryptography With Purpose: Embracing The Rigor",
          date: "July 2025",
          category: "Cryptography",
          url: "blog/pivoting-cryptography.html"
        },
        {
          title: "Week 1: Foundational Encryption Concepts",
          date: "August 2025",
          category: "Cryptography",
          url: "blog/week-1-foundational-encryption-concepts.html"
        },
        {
          title: "OSINT Techniques for Modern Investigations",
          date: "March 2024",
          category: "OSINT",
          url: "blog/osint-techniques-for-modern-investigations.html"
        },
        {
          title: "Reverse Engineering a Botnet Sample",
          date: "November 2023",
          category: "Reverse Engineering",
          url: "blog/reverse-engineering-a-botnet-sample.html"
        },
        {
          title: "Building a Secure Home Lab on a Budget",
          date: "May 2022",
          category: "Malware",
          url: "blog/building-a-secure-home-lab-on-a-budget.html"
        }
      ];

      posts.sort((a, b) => new Date(b.date) - new Date(a.date));
      const container = document.getElementById('latest-posts');
      posts.slice(0, 3).forEach(post => {
        const article = document.createElement('article');
        article.className = 'post-card';

        const category = document.createElement('span');
        category.className = 'post-category';
        category.textContent = post.category;
        article.appendChild(category);

        const title = document.createElement('h3');
        const link = document.createElement('a');
        link.href = post.url;
        link.textContent = post.title;
        title.appendChild(link);
        article.appendChild(title);

        const date = document.createElement('span');
        date.className = 'post-date';
        date.textContent = new Date(post.date).toLocaleDateString(undefined, {
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        });
        article.appendChild(date);

        container.appendChild(article);
      });
    </script>
  </body>
</html>
